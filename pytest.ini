[pytest]
# Recipe unit tests (run inside the SFT container, which has olmo_core + flash-attn):
#   docker run --rm --gpus all --entrypoint python <image> -m pytest olmocore/tests -q
# testpaths keeps a bare `pytest` from also collecting the ad-hoc scripts under fields/.
testpaths = olmocore/tests
addopts = -p no:cacheprovider
