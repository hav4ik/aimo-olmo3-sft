# Olmo 3 32B SFT — PROD-32B (3 nodes x 8 H200 = 24 GPUs)
#
# Full-param BF16, full 64K context. Do not launch this until prod-7b numbers
# are validated.

base_model: allenai/Olmo-3.1-32B-Think   # 32B thinking model (project decision)

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# Olmo-3.1-32B-Think ships its OWN ChatML+think chat template (with a default
# Olmo system prompt and <think>...</think> reasoning), so use tokenizer_default
# rather than forcing plain chatml. The real SFT dataset for this tier should
# carry <think>...</think> traces to match. (No special_tokens eos override here:
# the model's native template/eos governs its own stop behavior.)
chat_template: tokenizer_default
datasets:
  - path: allenai/tulu-3-sft-personas-math
    type: chat_template
    field_messages: messages
    split: train
dataset_prepared_path: /data/last_run_prepared
val_set_size: 0.0

sequence_len: 65536
sample_packing: true
pad_to_sequence_len: true

attn_implementation: flash_attention_3   # Hopper (H200); FA3 baked into the image

# NeMo mixed-precision Pattern B — FP32 optimizer state for clean full-param
# convergence. We deliberately do NOT set bf16/bfloat16: that would make axolotl
# load weights bf16-resident (config/__init__.py:105), and FSDP2 keeps no fp32
# master, so adamw_torch_fused would store bf16 m/v — which NVIDIA NeMo documents
# as silent convergence degradation (7-bit mantissa swamps small EMA updates).
# Leaving them unset loads weights fp32-resident (master + m + v in fp32); FSDP2
# casts params to bf16 for the forward/backward via mixed_precision_policy below.
# VERIFY on the first Hopper step that optimizer state dtype is float32 on run 1.
tf32: true

# True FP8 (tensorwise e4m3) on Hopper via torchao. The three knobs go together:
# FP8 without torch_compile is SLOWER than BF16 (scaling overhead dominates
# without graph fusion); float8 all-gather cuts FSDP comm. pad_to_sequence_len
# (set above) stops torch.compile recompiling on variable-length batches.
# Stage it: validate the BF16 baseline (comment these out) first, then enable FP8.
fp8: true
fp8_enable_fsdp_float8_all_gather: true
torch_compile: true
torch_compile_backend: inductor

fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Olmo3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  mixed_precision_policy: bf16   # bf16 compute on fp32-resident master (Pattern B)

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# 24 GPUs, micro=1, accum=8 -> 192 packed seqs/step
micro_batch_size: 1
gradient_accumulation_steps: 8

optimizer: adamw_torch_fused
learning_rate: 8.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: linear
warmup_ratio: 0.03
num_epochs: 3

save_strategy: steps
save_steps: 500
save_total_limit: 5
logging_steps: 10
output_dir: /data/checkpoints/olmo3-32b-tulu-math

wandb_project: olmo3-sft
wandb_name: olmo3-32b-prod

seed: 42
