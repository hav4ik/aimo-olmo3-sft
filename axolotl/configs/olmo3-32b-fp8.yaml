# Olmo 3 32B SFT — AXOLOTL / FP8, axolotl's BEST-EFFORT FP8 (NOT crippled to match OLMo-core).
# Recipe-level matches OLMo-core: seq 65536, LR 1e-4, betas (0.9,0.95), wd 0, grad-norm 1.0, warmup 0.03->0,
# 2 epochs, fused AdamW; tune grad_accum so GBS ~= 4,194,304 tok. FP8 INTERNALS differ by design (same
# limits as the 7B config — see olmo3-7b-fp8.yaml header): TENSORWISE only (OLMo-core runs ROWWISE on H200,
# tensorwise on sm_120), and FP8 on ALL linears (vs OLMo-core's FFN-only / attention+lm_head BF16) — each
# framework at its best. Needs FSDP2; wants torch_compile (not required — TORCH_COMPILE=false runs eager
# if the cu130 RoPE/cuBLAS compile error bites, see 7b-fp8 header). CONTEXT_PARALLEL_SIZE>1 for 65536. MODEL_SIZE=32b
# PRECISION=fp8. NOTE: axolotl has no bf16-optimizer-state / budget-AC equivalent — for the memory-bound
# 32B it uses full (FSDP2-native) activation checkpointing + fp32 fused-AdamW states (heavier than OLMo-core's options).

base_model: allenai/Olmo-3.1-32B-Think

special_tokens:
  eos_token: "<|endoftext|>"

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

chat_template: tokenizer_default
# PRE-TOKENIZED parquet (input_ids / labels[-100 prompt-masked] / attention_mask) — the SAME dolma2
# tokens as the olmo-core run, so axolotl-vs-olmo-core is apples-to-apples. axolotl auto-detects
# already-tokenized data (these 3 columns) and SKIPS online tokenization. run.sh fills in path +
# data_files (HF repo subfolder axolotl/sft_tokenized.parquet, or a local parquet file/dir).
datasets:
  - path: __DATASET__
    ds_type: parquet
    data_files: __DATA_FILES__
dataset_prepared_path: /data/last_run_prepared
val_set_size: 0.0

sequence_len: 65536          # match OLMo-core (no truncation). Needs CONTEXT_PARALLEL_SIZE>1 to fit.
sample_packing: true
pad_to_sequence_len: true

attn_implementation: flash_attention_3

tf32: true

# === THE ONLY DIFFERENCE FROM olmo3-32b-bf16.yaml ===
fp8: true
fp8_enable_fsdp_float8_all_gather: true
# ====================================================

torch_compile: true
torch_compile_backend: inductor

fsdp_version: 2
fsdp_config:
  offload_params: false
  activation_checkpointing: true   # FSDP2-native AC (replaces top-level gradient_checkpointing — no redundant backward all-gather)
  cpu_ram_efficient_loading: false   # MUST be false with torchao FP8 (accelerate hard-errors otherwise)
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Olmo3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  mixed_precision_policy: bf16

# activation checkpointing moved into fsdp_config above (FSDP2-native, non-reentrant): avoids the
# redundant backward all-gather that top-level gradient_checkpointing triggers under FSDP full-shard.

# 32B recipe GBS = 4,194,304 tok = 64 seqs @ seq 65536 (4x the 7B). Set grad_accum × dp_world = 64:
# e.g. 64 GPUs / CP=4 -> dp_world=16 -> grad_accum=4; 32 GPUs / CP=4 -> dp_world=8 -> grad_accum=8.
micro_batch_size: 1
gradient_accumulation_steps: 4

optimizer: adamw_torch_fused
learning_rate: 1.0e-4        # 32B think recipe (1e-4, vs the 7B's 5e-5)
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: linear
warmup_ratio: 0.03
num_epochs: 2

save_strategy: steps
save_steps: 500
save_total_limit: 3
logging_steps: 1
output_dir: /data/checkpoints/olmo3-32b-axolotl-fp8

wandb_project: olmo3-7b-sft
wandb_name: olmo3-32b-fp8

seed: 42
