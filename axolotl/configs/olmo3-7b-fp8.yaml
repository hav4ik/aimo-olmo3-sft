# Olmo 3 7B SFT — AXOLOTL / FP8, matched to the OLMo-core FP8 recipe as closely as axolotl allows.
#
# RECIPE-LEVEL params match OLMo-core exactly: seq 65536, LR 5e-5, betas (0.9,0.95), wd 0, grad-norm 1.0,
# linear warmup 0.03 -> 0, 2 epochs, fused AdamW. Tune grad_accum so GBS ~= 1,048,576 tok (see note below).
#
# FP8 INTERNALS axolotl CANNOT match — it exposes only `fp8` + `fp8_enable_fsdp_float8_all_gather` and
# routes through accelerate's torchao integration, so these OLMo-core FP8 choices are NOT reachable here:
#   - SCALING: axolotl = TENSORWISE e4m3 only. OLMo-core now defaults ROWWISE on H200 (sm_90) / tensorwise
#     on sm_120. => this arm matches OLMo-core's *tensorwise* path (OLMO_FP8=tensorwise / the RTX-6000
#     config), NOT the H200 ROWWISE production recipe. For an apples-to-apples A/B, run OLMo-core with
#     OLMO_FP8=tensorwise; do NOT compare this against rowwise.
#   - MODULE FILTER: axolotl FP8s ALL linears (accelerate skips lm_head + non-/16 dims). OLMo-core keeps
#     attention q/k/v/o + lm_head + embeddings in BF16 (DeepSeek recipe) and FP8s only the FFN. So this arm
#     quantizes MORE of the model — if it's less stable, the un-excluded attention is the likely cause.
#   - OPTIMIZER: fused AdamW here == OLMo-core's fused_adamw; for stable SFT == SkipStepAdamW when not
#     skipping (no spike-skip path in axolotl). LOSS: Cut Cross Entropy here vs OLMo-core materialized CE
#     (numerically ~equivalent).
# Matching rowwise + FFN-only would require monkeypatching accelerate's torchao recipe — not done here.
# Per axolotl, FP8 REQUIRES torch_compile + FSDP2 (both set). Pass CONTEXT_PARALLEL_SIZE>1 so 65536 fits.

base_model: allenai/Olmo-3-7B-Think

special_tokens:
  eos_token: "<|endoftext|>"

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# Model's own think-aware template (see olmo3-7b-bf16.yaml); transformers loads chat_template.jinja.
chat_template: tokenizer_default
# PRE-TOKENIZED parquet (input_ids / labels[-100 prompt-masked] / attention_mask) — the SAME dolma2
# tokens as the olmo-core run, so axolotl-vs-olmo-core is apples-to-apples. axolotl auto-detects
# already-tokenized data (these 3 columns) and SKIPS online tokenization. run.sh fills in path +
# data_files (HF repo subfolder axolotl/sft_tokenized.parquet, or a local parquet file/dir).
datasets:
  - path: __DATASET__
    ds_type: parquet
    data_files: __DATA_FILES__
dataset_prepared_path: /data/last_run_prepared
val_set_size: 0.0

sequence_len: 65536          # match OLMo-core (no truncation; non-negotiable). Needs CONTEXT_PARALLEL_SIZE>1.
sample_packing: true
pad_to_sequence_len: true

attn_implementation: flash_attention_3

tf32: true

# === THE ONLY DIFFERENCE FROM olmo3-7b-bf16.yaml ===
# True FP8 (tensorwise e4m3) on Hopper via torchao. float8 all-gather cuts FSDP comm
# (tensorwise-only). torch_compile is already on (required for FP8 to beat BF16).
fp8: true
fp8_enable_fsdp_float8_all_gather: true
# ===================================================

torch_compile: true
torch_compile_backend: inductor

fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Olmo3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  mixed_precision_policy: bf16

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# GBS = micro_batch × grad_accum × dp_world × seq_len; match OLMo-core's ~1,048,576 tok (=16 seqs of 65536).
# So set grad_accum × dp_world = 16: e.g. 8 GPUs / CP=2 -> dp_world=4 -> grad_accum=4 (as below);
# 4 GPUs / CP=2 -> dp_world=2 -> grad_accum=8. Adjust per launch topology to hit 1M.
micro_batch_size: 1
gradient_accumulation_steps: 4

optimizer: adamw_torch_fused
learning_rate: 5.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: linear
warmup_ratio: 0.03
num_epochs: 2

save_strategy: steps
save_steps: 500
save_total_limit: 5
logging_steps: 1
output_dir: /data/checkpoints/olmo3-7b-fp8

wandb_project: olmo3-7b-sft
wandb_name: olmo3-7b-fp8

seed: 42
