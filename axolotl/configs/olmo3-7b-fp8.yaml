# Olmo 3 7B SFT — AXOLOTL / FP8 (the precision-experiment arm)
#
# IDENTICAL to olmo3-7b-bf16.yaml except the fp8 block below — same data, seed,
# recipe, shapes, compile — so the BF16-vs-FP8 loss delta isolates precision.
#
# axolotl FP8 = accelerate + torchao float8, TENSORWISE e4m3 (comparable to the
# OLMo-core OLMO_FP8=tensorwise arm). NOTE two real asymmetries vs OLMo-core, worth
# keeping in mind when reading the stability curves:
#   - axolotl's FP8 module selection is accelerate-managed (skips non-divisible-by-16
#     dims); it does NOT do OLMo-core's explicit "keep full-attention blocks + lm_head
#     in high precision" exclusion. So this arm FP8s more of the model — if it's less
#     stable than OLMo-core's FP8, sensitive-layer exclusion is the likely reason.
#   - FP8 here is float8 on the LINEARS only (we do NOT enable fp8 attention).
# Per axolotl, FP8 REQUIRES torch_compile (scaling overhead dominates without graph
# fusion) and FSDP2 (already set). Validate the BF16 arm first, then this.

base_model: allenai/Olmo-3-7B-Think

special_tokens:
  eos_token: "<|endoftext|>"

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

chat_template: jinja
chat_template_jinja: /workspace/code/axolotl/olmo_chat_template.jinja
datasets:
  - path: allenai/tulu-3-sft-personas-math
    type: chat_template
    field_messages: messages
    split: train
dataset_prepared_path: /data/last_run_prepared
val_set_size: 0.0

sequence_len: 32768
sample_packing: true
pad_to_sequence_len: true

attn_implementation: flash_attention_3

tf32: true

# === THE ONLY DIFFERENCE FROM olmo3-7b-bf16.yaml ===
# True FP8 (tensorwise e4m3) on Hopper via torchao. float8 all-gather cuts FSDP comm
# (tensorwise-only). torch_compile is already on (required for FP8 to beat BF16).
fp8: true
fp8_enable_fsdp_float8_all_gather: true
# ===================================================

torch_compile: true
torch_compile_backend: inductor

fsdp_version: 2
fsdp_config:
  offload_params: false
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Olmo3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  mixed_precision_policy: bf16

gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

micro_batch_size: 1
gradient_accumulation_steps: 4

optimizer: adamw_torch_fused
learning_rate: 5.0e-5
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: linear
warmup_ratio: 0.03
num_epochs: 2

save_strategy: steps
save_steps: 500
save_total_limit: 5
logging_steps: 1
output_dir: /data/checkpoints/olmo3-7b-fp8

wandb_project: olmo3-sft
wandb_name: olmo3-7b-fp8

seed: 42
