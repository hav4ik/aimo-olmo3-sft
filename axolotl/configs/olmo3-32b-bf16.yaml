# Olmo 3 32B SFT — AXOLOTL / BF16. Multi-node (the reference 32b_think_sft uses many
# nodes); axolotl is the FALLBACK here — OLMo-core is the reference path for 32B. AI2's
# 32b_think_sft recipe: lr 1e-4, 2 epochs, global batch 4,194,304 tok, seq 32768 — NB the 32B
# uses a HIGHER lr + 4x batch than the 7B (5e-5 / 1,048,576). Select with MODEL_SIZE=32b.
# Validate the 7B first; see SCALEUP_32B.md for the full plan.

base_model: allenai/Olmo-3.1-32B-Think

# eos = <|endoftext|> (the model's native stop). Olmo 3 declares both <|im_end|>(100265) +
# <|endoftext|>(100257) as eos. With tokenizer_default the model's own tokenizer eos governs.
special_tokens:
  eos_token: "<|endoftext|>"

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

# The model's OWN think-aware template (Olmo-3.1-32B-Think ships chat_template.jinja;
# transformers loads it). Real 32B SFT data should carry <think>...</think> to match.
chat_template: tokenizer_default
# PRE-TOKENIZED parquet (input_ids / labels[-100 prompt-masked] / attention_mask) — the SAME dolma2
# tokens as the olmo-core run, so axolotl-vs-olmo-core is apples-to-apples. axolotl auto-detects
# already-tokenized data (these 3 columns) and SKIPS online tokenization. run.sh fills in path +
# data_files (HF repo subfolder axolotl/sft_tokenized.parquet, or a local parquet file/dir).
datasets:
  - path: __DATASET__
    ds_type: parquet
    data_files: __DATA_FILES__
dataset_prepared_path: /data/last_run_prepared
val_set_size: 0.0

sequence_len: 65536          # match OLMo-core (no truncation). Needs CONTEXT_PARALLEL_SIZE>1.
sample_packing: true
pad_to_sequence_len: true    # fixed shape -> torch.compile doesn't recompile per batch

attn_implementation: flash_attention_3   # H200; run.sh overrides per GPU arch

# Precision: axolotl's bf16 defaults to "auto" and resolves TRUE on Hopper, so this trains in
# standard bf16 mixed precision — bf16-resident params + FSDP2 mixed_precision_policy bf16 below.
# NB (audit-confirmed): NOT an fp32-resident master; adamw_torch_fused keeps bf16-derived optimizer
# state. Fine for a 2-epoch SFT. For bf16-param/fp32-reduce, use the OLMo-core reference path.
tf32: true
torch_compile: true          # parity with the FP8 variant (which requires it)
torch_compile_backend: inductor

fsdp_version: 2
fsdp_config:
  offload_params: false
  activation_checkpointing: true   # FSDP2-native AC (replaces top-level gradient_checkpointing — no redundant backward all-gather)
  cpu_ram_efficient_loading: true
  auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap: Olmo3DecoderLayer
  state_dict_type: FULL_STATE_DICT
  reshard_after_forward: true
  mixed_precision_policy: bf16

# activation checkpointing moved into fsdp_config above (FSDP2-native, non-reentrant): avoids the
# redundant backward all-gather that top-level gradient_checkpointing triggers under FSDP full-shard.

# 32B recipe global batch = 4,194,304 tok = 128 seqs @ seq 32768 (4x the 7B). micro 1 x accum
# x num_gpus = 128: 32 GPUs -> accum 4 (below); 64 -> accum 2; 16 -> accum 8. Adjust for your shape.
micro_batch_size: 1
gradient_accumulation_steps: 4

optimizer: adamw_torch_fused
learning_rate: 1.0e-4        # 32B think recipe (32B uses 1e-4, vs the 7B's 5e-5)
adam_beta1: 0.9
adam_beta2: 0.95
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler: linear
warmup_ratio: 0.03
num_epochs: 2

save_strategy: steps
save_steps: 500
save_total_limit: 3
logging_steps: 1
output_dir: /data/checkpoints/olmo3-32b-axolotl-bf16

wandb_project: olmo3-7b-sft
wandb_name: olmo3-32b-bf16

seed: 42
